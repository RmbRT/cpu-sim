// next steps: split bindings into env (imports into the WASM app) / ext (js-side extensions to WASM app).
// All imports need to check whether they are async: fn.constructor.name == "AsyncFunction"
// When calling a WASM function from js, we need WebAssembly.promising() if it uses a Promise, but we do not want to use it if it doesn't. We can abuse the fact that it will trap on the first call if it is not properly wrapped. So we create a proxy call that will replace itself after the first call, either with Promising, or with the direct WASM function. This way, trap once, catch it, and then …
// actually, we want asynchronous and batchable syscalls to begin with. And if we do not own the main() function, we also do not need a blocking wait/poll.
// also, async is unable to have multiple ongoing executions, even if suspended, so it is essentially useless.

// So, we first want to make a syscall interface:
// - some commands are fire-and-forget, like GL calls. These can just be synchronous.
// - some have an immediate result, and batching/async would only be useful if we were to try to reduce boundary switches. These however would also benefit from having programmable logic that can execute sequential commands.
// - some are simply blocking and might need syncing or awaiting a result.

// So, we have two types of syscalls:
// - immediate, and/or fire-and-forget calls that we only issue, but do not wait for.
// - blocking, with a wakeup.

const syscalls = {
	module_panicked(_msg, m, _file, f, line, _fun, fn) {
		const msg = (new TextDecoder()).decode(this.memory_span(_msg, m)).trim();
		const file = (new TextDecoder()).decode(this.memory_span(_file, f));
		const fun = (new TextDecoder()).decode(this.memory_span(_fun, fn));
		console.error("panic: " + msg, {in: fun + "()", [file]: line});
		if("alert" in globalThis)
			alert("panic in " + fun + "(): " + msg + "\n\n        in "+file+":"+line);
	},

	invalidated_memory() { this.renew_memory_views(); },

	log_int(mem, size, v) {
		const msg = (new TextDecoder()).decode(this.memory_span(mem, size));
		console.info(`${msg}:`, v, `(0x${v.toString(16)})`);
	},

	requestTimerMs(ms, handlerFn, v1, v2) {
		window.setTimeout(() => this.__wasm_on_timer(handlerFn, v1, v2), ms);
	},

	on_input_event(e) { },

	set_window_title(txt, len)
	{
		const msg = (new TextDecoder()).decode(this.memory_span(txt, len));
		document.title = msg;
	},

	schedule_repaint(force) {
		this.schedule_repaint(force);
	}
};

<canvas id="game" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; image-rendering: pixelated;"></canvas>

<script>
	// Repaint and resize the canvas when the window size changes.
	window.addEventListener("resize", async() => {
		wasmApp = await wasmApp;
		wasmApp.needs_resize = true;
		wasmApp.schedule_repaint(true);
	});

	// Handle hidden tabs properly.
	wasmApp.then(app =>
		document.addEventListener("visibilitychange", () =>
			app.on_tab_visibility(document.hidden)));

	wasmApp.then(app => app.schedule_repaint());

	(() => {
		const canvas = document.getElementById("game");
		canvas.width = window.innerWidth;
		canvas.height = window.innerHeight;

		const glOptions = {
			"alpha": true, // allocate 32 bits per fb pixel
			"depth": true,
			"stencil": false,
			"desynchronised": true,
			"antialias": true,
			"failIfMajorPerformanceCaveat": true,
			"powerPreference": "default",
			"premultipliedAlpha": true, // for faster compositing. Multiplies the alpha value into the colour values.
			"preserveDrawingBuffer": false,
			"xrCompatible": false
		};
		let gl = canvas.getContext("webgl2", glOptions);
		if(!gl)
		{
			console.warn("WebGL: failed to create WebGL2 context");
			gl = canvas.getContext("webgl", glOptions);
		} else { console.info("Using WebGL 2"); }
		if(!gl)
		{
			console.warn("WebGL: failed to create context, retrying without MSAA");
			glOptions.antialias = false;
			gl = canvas.getContext("webgl", glOptions);
		}
		if(!gl)
		{
			alert("failed to create WebGL context");
			return;
		}

		bindings.extensions.activate_context(gl);
	})();
