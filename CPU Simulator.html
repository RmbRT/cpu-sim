				type}) // "VERTEX_SHADER" or "FRAGMENT_SHADER"
			{
				let shader = gl.createShader(gl[type]);
				gl.shaderSource(shader, source);
				gl.compileShader(shader);

				// If compilation status is false (failed), terminate.
				if(!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
				{
					// Retrieve the compile error message.
					let errorMessage = gl.getShaderInfoLog(shader);

					// Terminate with an exception.
					throw new Error(`Compiling ${type} shader: ${errorMessage}`);
				}

				// Otherwise, return the shader.
				return shader;
			}

			function webglPrepareShaderProgram({
				// The source code of the vertex shader.
				vertSource,
				// The source code of the fragment shader.
				fragSource,
				// An array containing the names of all vertex attributes.
				vertexAttribs})
			{
				// create the two shaders.
				let vertex = webglCreateShader({source:vertSource, type:"VERTEX_SHADER"});
				let fragment = webglCreateShader({source:fragSource, type:"FRAGMENT_SHADER"});

				// create the shader program.
				let program = gl.createProgram();

				// associate both shaders with the shader program.
				gl.attachShader(program, vertex);
				gl.attachShader(program, fragment);

				// Compile the final shader program.
				gl.linkProgram(program);

				// we can now safely delete the shaders and keep the program.
				gl.detachShader(program, vertex);
				gl.detachShader(program, fragment);
				gl.deleteShader(vertex);
				gl.deleteShader(fragment);

				// Check for compilation errors.
				if(!gl.getProgramParameter(program, gl.LINK_STATUS))
				{
					// Retrieve the compile error message.
					let errorMessage = gl.getProgramInfoLog(program);

					throw new Error(`Linking shader program failed: ${errorMessage}`);

					attributes[attr] = location;

		let activeShaderUniforms = [];
		const programs = [null];
		const programs_free = [];

		const glUseProgram = gl.useProgram.bind(gl);
		sys["glUseProgram"] = function(id) {

				vx_src, vx_len,

				attrs_names, attr_locs, attr_len,
				uniform_names, uniform_locs, uniform_len)
		{
			const attrs = new Array(attr_len);
			const attr_names = this.memory_span_x(Uint32Array, attrs_names, attr_len);
			for(let i = 0; i < attr_len; i++)
			{
				const attr = this.c_str(attr_names[i]);
				attrs[i] = attr;
			}
			let { program, attributes } = webglPrepareShaderProgram({
				vertSource: this.str(vx_src, vx_len),
				fragSource: this.str(px_src, px_len),
				vertexAttribs: attrs
			});

			{
				let locs = this.memory_span_x(Uint32Array, attr_locs, attr_len);
				for(let i = 0; i < attr_len; i++)
				{
					console.info("vertex attribute", attrs[i], attributes[attrs[i]]);
					locs[i] = attributes[attrs[i]];
				}
			}

			let uniforms = [];
			{
				let names = this.memory_span_x(Uint32Array, uniform_names, uniform_len);
				let locs = this.memory_span_x(Uint32Array, uniform_locs, uniform_len);
				for(let i = 0; i < uniform_len; i++)
				{
					locs[i] = uniforms.length;
					const name = this.c_str(names[i]);
					console.log("Uniform", name, locs[i]);
					uniforms.push(gl.getUniformLocation(program, name));
				}

			return programs.push({program, uniforms})-1;
		}

		const textures = [null];
		const textures_free = [];

		const glCreateTexture = gl.createTexture.bind(gl);
		sys["glGenTextures"] = function(num, handles) {
			const handles_v = this.memory_span_x(Uint32Array, handles, num);
			for(let i = 0; i < num; i++)
			{
				let tex = glCreateTexture();
				let id = (textures_free.length) ? textures_free.pop() : textures.push(tex)-1;
				handles_v[i] = id;
				textures[id] = tex;
			}
		};
		sys["glDeleteTextures"] = function(n, handles) {
			let view = this.memory_view(handles, 4*n);
			for(let i = 0; i < n; i++)
			{
				let id = view.getUint32(4*i, true);
				glDeleteTexture(textures[id]);
				textures[id] = undefined;
				textures_free.push(id);
			}
		};

		const glBindTexture = gl.bindTexture.bind(gl);
		sys["glBindTexture"] = function(target, handle) {

		};

		sys["glGetCurrentTexture2D"] = function() {

			return textures.indexOf(tex);
		};
		sys["glGetActiveTexture"] = function() {
			return gl.getParameter(gl.ACTIVE_TEXTURE);
		};

		for(let type of ["f", "i"])
		{
			const glUniform1 = gl["uniform1"+type].bind(gl);
			sys["glUniform1"+type] = function(slot, v0) {
				glUniform1(activeShaderUniforms[slot], v0);
			};

			const glUniform2 = gl["uniform2"+type].bind(gl);
			sys["glUniform2"+type] = function(slot, v0, v1) {
				glUniform2(activeShaderUniforms[slot], v0, v1);
			};

			const glUniform3 = gl["uniform3"+type].bind(gl);
			sys["glUniform3"+type] = function(slot, v0, v1, v2) {
				glUniform3(activeShaderUniforms[slot], v0, v1, v2);
			};

			const glUniform4 = gl["uniform4"+type].bind(gl);
			sys["glUniform4"+type] = function(slot, v0, v1, v2, v3) {
				glUniform4(activeShaderUniforms[slot], v0, v1, v2, v3);
			};
		}
		for(let _dim = 1; _dim <= 4; _dim++)
		{
			const dim = _dim;
			const glUniformfv = gl["uniform"+dim+"fv"].bind(gl);

			};

			const glUniformiv = gl["uniform"+dim+"iv"].bind(gl);
			sys["glUniform"+dim+"iv"] = (isWebGL2Bug) ?
			function(slot, ptr) {

		sys["glUniformMatrix4fv"] = (isWebGL2Bug) ?
		function(slot, ptr) {
			glUniformMatrix4fv(
				activeShaderUniforms[slot],

				this.memory_f32, ptr >> 2, 16);

			glUniformMatrix4fv(
				activeShaderUniforms[slot],
				false, // WebGL 1 forbids "transpose" to be true

		};
		const glUniformMatrix3fv = gl.uniformMatrix3fv.bind(gl);
		sys["glUniformMatrix3fv"] = (isWebGL2Bug) ?
		function(slot, ptr) {
			glUniformMatrix3fv(
				activeShaderUniforms[slot],
				false,
				this.memory_f32, ptr >> 2, 9);
		} : function(slot, ptr) {
			glUniformMatrix3fv(
				activeShaderUniforms[slot],
				false, // WebGL 1 forbids "transpose" to be true
				this.memory_span_x(Float32Array, ptr, 9));
		};
		const glUniformMatrix2fv = gl.uniformMatrix2fv.bind(gl);
		sys["glUniformMatrix2fv"] = (isWebGL2Bug) ?
		function(slot, ptr) {
			glUniformMatrix2fv(
				activeShaderUniforms[slot],
				false,
				this.memory_f32,
				ptr >> 2, 4);
		} : function(slot, ptr) {
			glUniformMatrix2fv(
				activeShaderUniforms[slot],
				false, // WebGL 1 forbids "transpose" to be true
				this.memory_span_x(Float32Array, ptr, 4));
		};
	},

	schedule_repaint(force) {
		if(force) this.clean = false;
		if(this.scheduled) return;
		this.scheduled = true;
		window.___wasmApp = this;
		window.requestAnimationFrame(this.__raf);
	},

	__raf() { window.___wasmApp.scheduled = false; window.___wasmApp._repaint(); },

	on_tab_visibility(hidden)
	{
		// if we are intending to render, but the tab becomes hidden, we inform the next frame (whenever it happens) that it was delayed.
		if(hidden)
			if(this.scheduled)
				this._was_inactive_tab = true;
	},

	_repaint(last_frame_end) {
		if(this.rendering) return;
		if(this.clean) return;
		if(this.scheduled) return;
		this._frame_odd = !this._frame_odd;

		const c = document.getElementById("game");
		if(this.needs_resize) {
			c.width = window.innerWidth;
			c.height = window.innerHeight;
			console.log("canvas resize:", c.width, c.height);
			this.needs_resize = false;
		}


		
		let now = performance.now();

		let dt_ms = now - this._last_render_start;
		this._last_render_start = now;

		// if we were delayed because inactive tab, ignore skipped time.
		if(this._was_inactive_tab)
		{
			this._was_inactive_tab = false;
			dt_ms = now - last_frame_end;
		}

		this.rendering = true;
		// make sure to not overwrite requests to repaint that were issued during rendering.
		this.clean = true;
		this.clean &= this.on_frame(c.width, c.height, dt_ms * 1000 | 0); // dt_us
		this.rendering = false;


		if(!this.clean) this.schedule_repaint();
	}

<canvas id="game" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; image-rendering: pixelated;"></canvas>

<script>
	// Repaint and resize the canvas when the window size changes.
	window.addEventListener("resize", async() => {
		wasmApp = await wasmApp;
		wasmApp.needs_resize = true;
		wasmApp.schedule_repaint(true);
	});

	// Handle hidden tabs properly.
	wasmApp.then(app =>
		document.addEventListener("visibilitychange", () =>
			app.on_tab_visibility(document.hidden)));

	wasmApp.then(app => app.schedule_repaint());

	(() => {
		const canvas = document.getElementById("game");
		canvas.width = window.innerWidth;
		canvas.height = window.innerHeight;

		const glOptions = {
			"alpha": true, // allocate 32 bits per fb pixel
			"depth": true,
			"stencil": false,
			"desynchronised": true,
			"antialias": true,
			"failIfMajorPerformanceCaveat": true,
			"powerPreference": "default",
			"premultipliedAlpha": true, // for faster compositing. Multiplies the alpha value into the colour values.
			"preserveDrawingBuffer": false,
			"xrCompatible": false
		};
		let gl = canvas.getContext("webgl2", glOptions);
		if(!gl)
		{
			console.warn("WebGL: failed to create WebGL2 context");
			gl = canvas.getContext("webgl", glOptions);
		} else { console.info("Using WebGL 2"); }
		if(!gl)
		{
			console.warn("WebGL: failed to create context, retrying without MSAA");
			glOptions.antialias = false;
			gl = canvas.getContext("webgl", glOptions);
		}
		if(!gl)
		{
			alert("failed to create WebGL context");
			return;
		}

		bindings.extensions.activate_context(gl);
	})();
</script>
